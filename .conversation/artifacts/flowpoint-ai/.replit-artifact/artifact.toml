kind = "web"
previewPath = "/"
title = "FlowPoint AI"
description = "A Supabase-backed workspace for contacts, inbox conversations, business policies, properties, services, requests, and AI-assisted follow-up workflows."
version = "1.0.0"
id = "artifacts/flowpoint-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20756

[services.development]
run = "pnpm --filter @workspace/flowpoint-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flowpoint-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/flowpoint-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20756"
BASE_PATH = "/"
